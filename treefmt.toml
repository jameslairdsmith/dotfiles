# Project-local copy of treefmt/treefmt.toml. Its presence at the workspace
# root also activates the treefmt VS Code extension.

[formatter.nixfmt]
command = "nixfmt"
includes = ["*.nix"]

[formatter.air]
command = "air"
options = ["format"]
includes = ["*.R", "*.r"]

[formatter.elisp-autofmt]
command = "elisp-autofmt"
includes = ["*.el"]

[formatter.panache]
command = "panache"
options = ["format"]
includes = ["*.md", "*.Rmd", "*.rmd", "*.Qmd", "*.qmd"]
