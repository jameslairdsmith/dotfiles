# treefmt configuration.
#
# Managed via dotfiles (nix/modules/treefmt.nix): this file is symlinked to
# ~/.config/treefmt/treefmt.toml and used as the default config everywhere via
# the $TREEFMT_CONFIG environment variable. When run inside a git repo, treefmt
# uses that repo's root as the tree root automatically.

# Nix files are formatted with nixfmt (see AGENTS.md). nixfmt edits in place.
[formatter.nixfmt]
command = "nixfmt"
includes = ["*.nix"]

# R files are formatted with Air.
[formatter.air]
command = "air"
options = ["format"]
includes = ["*.R", "*.r"]

# Emacs Lisp files are formatted with elisp-autofmt via a Nix-managed wrapper.
[formatter.elisp-autofmt]
command = "elisp-autofmt"
includes = ["*.el"]

# Markdown, R Markdown, and Quarto files are formatted with Panache.
[formatter.panache]
command = "panache"
options = ["format"]
includes = ["*.md", "*.Rmd", "*.rmd", "*.Qmd", "*.qmd"]
